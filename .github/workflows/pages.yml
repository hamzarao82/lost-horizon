name: Deploy site

# Builds the portfolio (Next.js static export) and publishes it to GitHub Pages.
# The Godot web build is NOT rebuilt here: commit the exported files to site-assets/play/
# (see docs/RELEASE.md) and this workflow copies them to <site>/play/.
#
# Pages cannot set custom HTTP headers, so the web export must stay single-threaded
# (export_presets.cfg already uses variant/thread_support=false). A threaded build would need
# COOP/COEP headers (SharedArrayBuffer) and would not start on Pages.

on:
  push:
    branches: [main, master]
    paths:
      - "portfolio/**"
      - "site-assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build portfolio
        working-directory: portfolio
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - name: Add the Godot web build (if committed)
        run: |
          if [ -f site-assets/play/index.html ]; then
            mkdir -p portfolio/out/play
            cp -r site-assets/play/. portfolio/out/play/
            echo "Added Godot web build: $(du -sh portfolio/out/play | cut -f1)"
          else
            echo "::warning::site-assets/play/index.html not found; the Play button will 404."
          fi
          touch portfolio/out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
